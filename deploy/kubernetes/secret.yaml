# ============================================================================
# KISS Mail - Secrets
# ============================================================================
# NOTE: In production, use external secrets management (Vault, AWS Secrets
# Manager, External Secrets Operator, etc.).
#
# Only add keys you actually use. Do NOT leave keys with empty values:
#   - an empty KISS_MAIL_API_KEY simply disables the REST API, so it is
#     pointless to set;
#   - any LDAP_URL value (even empty) turns LDAP authentication on.
# Values under `data:` must be base64 encoded:  echo -n "value" | base64
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: kiss-mail-secrets
  namespace: kiss-mail
  labels:
    app.kubernetes.io/name: kiss-mail
    app.kubernetes.io/component: secrets
type: Opaque
data: {}
  # API key for remote administration (enables the REST API)
  # KISS_MAIL_API_KEY: <base64>
  #
  # LDAP bind password
  # LDAP_BIND_PASSWORD: <base64>
  #
  # SSO client secret (generic OIDC; or use GOOGLE_CLIENT_SECRET,
  # MICROSOFT_CLIENT_SECRET, OKTA_CLIENT_SECRET, AUTH0_CLIENT_SECRET,
  # ONEPASSWORD_CLIENT_SECRET for a specific provider)
  # SSO_CLIENT_SECRET: <base64>
---
# ============================================================================
# KISS Mail - LDAP ConfigMap (Optional)
# ============================================================================
# Setting LDAP_URL enables LDAP authentication. Uncomment and configure only
# if you use LDAP (replace `data: {}` with `data:`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kiss-mail-ldap-config
  namespace: kiss-mail
  labels:
    app.kubernetes.io/name: kiss-mail
    app.kubernetes.io/component: ldap-config
data: {}
  # LDAP_URL: "ldap://ldap.example.com:389"
  # LDAP_BASE_DN: "dc=example,dc=com"
  # LDAP_BIND_DN: "cn=admin,dc=example,dc=com"
  # LDAP_USER_FILTER: "(uid={username})"
  # LDAP_USE_STARTTLS: "true"
  # LDAP_FALLBACK_LOCAL: "true"
---
# ============================================================================
# KISS Mail - SSO ConfigMap (Optional)
# ============================================================================
# The provider is selected by which variables are set:
#   Google:     GOOGLE_CLIENT_ID (+ GOOGLE_CLIENT_SECRET)
#   Microsoft:  MICROSOFT_CLIENT_ID, MICROSOFT_TENANT_ID (+ secret)
#   Okta:       OKTA_CLIENT_ID, OKTA_DOMAIN (+ secret)
#   Auth0:      AUTH0_CLIENT_ID, AUTH0_DOMAIN (+ secret)
#   1Password:  ONEPASSWORD_CLIENT_ID (+ secret)
#   Generic OIDC: SSO_CLIENT_ID, SSO_AUTH_URL, SSO_TOKEN_URL, SSO_USERINFO_URL
# Put client secrets in kiss-mail-secrets, not here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kiss-mail-sso-config
  namespace: kiss-mail
  labels:
    app.kubernetes.io/name: kiss-mail
    app.kubernetes.io/component: sso-config
data: {}
  # GOOGLE_CLIENT_ID: "1234567890-abc.apps.googleusercontent.com"
  # SSO_REDIRECT_URI: "https://mail.example.com/callback"
