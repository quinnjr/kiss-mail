# ============================================================================
# KISS Mail - Deployment
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiss-mail
  namespace: kiss-mail
  labels:
    app.kubernetes.io/name: kiss-mail
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kiss-mail
      app.kubernetes.io/component: server
  strategy:
    type: Recreate  # Single instance for mail server consistency
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kiss-mail
        app.kubernetes.io/component: server
      annotations:
        prometheus.io/scrape: "false"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      containers:
        - name: kiss-mail
          image: ghcr.io/quinnjr/kiss-mail:latest
          imagePullPolicy: Always
          
          ports:
            - name: smtp
              containerPort: 2525
              protocol: TCP
            - name: imap
              containerPort: 1143
              protocol: TCP
            - name: pop3
              containerPort: 1100
              protocol: TCP
            # Implicit TLS
            - name: smtps
              containerPort: 4465
              protocol: TCP
            - name: imaps
              containerPort: 1993
              protocol: TCP
            - name: pop3s
              containerPort: 1995
              protocol: TCP
            - name: web
              containerPort: 8080
              protocol: TCP
            - name: api
              containerPort: 8025
              protocol: TCP
          
          envFrom:
            - configMapRef:
                name: kiss-mail-config
            - configMapRef:
                name: kiss-mail-ldap-config
                optional: true
            - configMapRef:
                name: kiss-mail-sso-config
                optional: true
            - secretRef:
                name: kiss-mail-secrets
                optional: true
          
          # readOnlyRootFilesystem is enabled below: all state lives in the
          # data volume at /data (KISS_MAIL_DATA_DIR=/data in the ConfigMap).
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            # Optional: certificate from a kubernetes.io/tls Secret (e.g.
            # issued by cert-manager). Mount the whole Secret as a directory -
            # never single files, which would hide renewals - and set KISS_MAIL_TLS_CERT
            # and KISS_MAIL_TLS_KEY in configmap.yaml. Without it, the server
            # uses /data/tls/cert.pem + key.pem or a self-signed certificate.
            # - name: tls
            #   mountPath: /etc/kiss-mail/tls
            #   readOnly: true
          
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          
          livenessProbe:
            tcpSocket:
              port: smtp
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            tcpSocket:
              port: smtp
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kiss-mail-data
        - name: tmp
          emptyDir: {}
        # Optional: see the tls volumeMount above. defaultMode 0440 plus
        # fsGroup 1000 lets uid 1000 read the key.
        # - name: tls
        #   secret:
        #     secretName: kiss-mail-tls   # e.g. a cert-manager Certificate's secretName
        #     defaultMode: 0440
      
      # Optional: Node selector
      # nodeSelector:
      #   kubernetes.io/os: linux
      
      # Optional: Tolerations
      # tolerations:
      #   - key: "dedicated"
      #     operator: "Equal"
      #     value: "mail"
      #     effect: "NoSchedule"
