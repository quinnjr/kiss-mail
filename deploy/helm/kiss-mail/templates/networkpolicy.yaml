{{- if .Values.networkPolicy.enabled }}
# Example NetworkPolicy: mail and web ports are open, the REST API port is
# reachable only from networkPolicy.apiFrom (nothing when empty).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kiss-mail.fullname" . }}
  labels:
    {{- include "kiss-mail.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kiss-mail.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.ports.smtp }}
          protocol: TCP
        - port: {{ .Values.ports.imap }}
          protocol: TCP
        - port: {{ .Values.ports.pop3 }}
          protocol: TCP
        {{- if include "kiss-mail.tlsEnabled" . }}
        - port: {{ .Values.ports.smtps }}
          protocol: TCP
        - port: {{ .Values.ports.imaps }}
          protocol: TCP
        - port: {{ .Values.ports.pop3s }}
          protocol: TCP
        {{- end }}
        {{- if .Values.webAdmin.enabled }}
        - port: {{ .Values.ports.web }}
          protocol: TCP
        {{- end }}
    {{- if and .Values.api.enabled .Values.networkPolicy.apiFrom }}
    - from:
        {{- toYaml .Values.networkPolicy.apiFrom | nindent 8 }}
      ports:
        - port: {{ .Values.ports.api }}
          protocol: TCP
    {{- end }}
{{- end }}
