{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kiss-mail.fullname" . }}
  labels:
    {{- include "kiss-mail.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- $listed := list }}
          {{- range .paths }}{{ $listed = append $listed .path }}{{ end }}
          {{- /* Web-port paths every host needs: the self-service password
               page, the stylesheet/script of the web UI and the SSO callback */}}
          {{- range $extra := list (dict "path" "/account" "type" "Prefix") (dict "path" "/static" "type" "Prefix") (dict "path" "/callback" "type" "Exact") }}
          {{- if not (has $extra.path $listed) }}
          - path: {{ $extra.path }}
            pathType: {{ $extra.type }}
            backend:
              service:
                name: {{ include "kiss-mail.fullname" $ }}
                port:
                  name: web
          {{- end }}
          {{- end }}
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "kiss-mail.fullname" $ }}
                port:
                  {{- if eq .path "/api" }}
                  name: api
                  {{- else }}
                  name: web
                  {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
