[package]
name = "kiss-mail"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
description = "A KISS (Keep It Simple, Stupid) SMTP, IMAP, and POP3 mail server"
license = "MIT"
authors = ["Joseph R. Quinn <quinn.josephr@protonmail.com>"]
repository = "https://github.com/quinnjr/kiss-mail"
homepage = "https://github.com/quinnjr/kiss-mail"
documentation = "https://docs.rs/kiss-mail"
readme = "README.md"
keywords = ["email", "smtp", "imap", "pop3", "mail-server"]
categories = ["email", "network-programming", "command-line-utilities"]
exclude = [
    ".github/",
    "deploy/",
    "target/",
    "*.md",
    "!README.md",
    "docker-compose.yml",
    "Dockerfile*",
]

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
argon2 = { version = "0.5.3", features = ["std"] }
rand = { version = "0.10.3", features = ["std"] }
hostname = "0.4.2"
libc = "0.2.179"
# rustls (ring) instead of native-tls/OpenSSL so cross-compiled release builds need no system OpenSSL
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
sha2 = "0.11.0"
urlencoding = "2.1.3"
axum = { version = "0.8.8", features = ["json"] }
# HTTP/2 and compression are unused (the admin UI sits behind nginx or on
# localhost); dropping them removes h2 0.3 (RUSTSEC-2026-0258).
actix-web = { version = "4.15", default-features = false, features = ["macros", "cookies"] }
handlebars = "6.4.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
# Native TLS / STARTTLS: ring provider only (no aws-lc: it needs cmake/nasm and
# breaks the musl and cross builds). CI checks `cargo tree -i aws-lc-sys`.
rustls       = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen        = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
x509-parser  = "0.18"   # notAfter/notBefore and SAN inspection

[dev-dependencies]
tempfile = "3.24.0"
